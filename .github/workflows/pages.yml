name: pages

# GitHub Pages can only serve a branch's root or /docs, and the site lives in
# site/.  Deploying through Actions keeps it there.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is hand-authored static files: nothing to build, so the only
      # thing worth checking is that what we are about to publish is intact.
      - name: Sanity-check the payload
        run: |
          set -e
          test -f site/index.html
          test -f site/style.css
          test -f site/app.js
          node --check site/app.js
          for f in $(grep -oE 'src="[^"]+"|href="[^"]+"' site/index.html \
                     | sed 's/.*="//;s/"$//' | grep -vE '^(https?:|data:|#|mailto:)'); do
            test -e "site/$f" || { echo "missing local asset: site/$f"; exit 1; }
          done
          echo "payload ok — $(du -sh site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
